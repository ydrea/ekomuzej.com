<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ekomuzej - web i mobilne aplikacije</title>
    <link rel="stylesheet" href="style.css" />
    <script src="//unpkg.com/alpinejs" defer></script>
  </head>
  <body>
    <!-- Overlay for clicking outside modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>

    <div class="c" id="top">
      <main class="container" x-data="app()">
        <!-- Content boxes - start blue, reveal to green -->
        <template x-for="(box, index) in contentBoxes" :key="index">
          <div
            class="box"
            :class="{ 'green': box.revealed }"
            @click="boxHasAction(box) ? box.action($data) : openModal(box)"
            x-init="setTimeout(() => { box.revealed = true }, index * 100 + 300)"
          >
            <span
              x-show="box.revealed"
              x-text="box.dynamicTitle ? 
    (box.pjat === 'languages' ? currentLanguage : 
    (currentTheme === 'light' ? themeNames?.light : themeNames?.dark)) 
    : box.title"
            ></span>
          </div>
        </template>

        <!-- Transparent boxes - start blue, reveal to transparent -->
        <template x-for="(box, index) in transparentBoxes" :key="index">
          <div
            class="box"
            :class="{ 'trans': box.revealed }"
            x-init="setTimeout(() => { box.revealed = true }, (index + contentBoxes.length) * 100 + 300)"
          ></div>
        </template>

        <!-- Velebit image and title -->
        <div class="veleb">
          <img src="velebit_z.jpg" alt="Velebit" />
        </div>
        <h1 class="title">Ekomuzej</h1>

        <!-- MODAL INSIDE THE CONTAINER -->
        <div id="pjatModal" class="modal">
          <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">×</button>
            <div id="modalContent"></div>
          </div>
        </div>
      </main>
    </div>

    <footer class="fut">
      <!-- cookies & copyright -->
    </footer>

    <script>
      // Simple modal functions
      function openModal(content) {
        const modal = document.getElementById("pjatModal");
        const overlay = document.getElementById("modalOverlay");
        const contentDiv = document.getElementById("modalContent");

        contentDiv.innerHTML = content;
        modal.classList.add("active");
        overlay.classList.add("active");
      }

      function closeModal() {
        const modal = document.getElementById("pjatModal");
        const overlay = document.getElementById("modalOverlay");
        modal.classList.remove("active");
        overlay.classList.remove("active");
      }

      // Close modal with Escape key
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          closeModal();
        }
      });

      function app() {
        return {
          currentTheme: "light",
          currentLanguage: "hr",
          themeNames: { light: "svijetla", dark: "tamna" },

          init() {
            this.updateBoxTitles();
            document.documentElement.setAttribute(
              "data-theme",
              this.currentTheme
            );
          },

          toggleTheme() {
            this.currentTheme =
              this.currentTheme === "light" ? "dark" : "light";
            document.documentElement.setAttribute(
              "data-theme",
              this.currentTheme
            );
          },

          cycleLanguage() {
            const languages = ["hr", "en", "it"];
            const currentIndex = languages.indexOf(this.currentLanguage);
            const nextIndex = (currentIndex + 1) % languages.length;
            this.currentLanguage = languages[nextIndex];
            this.updateBoxTitles();
          },

          updateBoxTitles() {
            const languageTitles = {
              hr: [
                "o ekomuzeju",
                "mobilne aplikacije",
                "društvene mreže",
                "jezici",
                "teme",
                "o nama",
                "DEMO",
                "ponuda",
                "reference",
                "kontakt",
              ],
              en: [
                "about ecomuseum",
                "mobile apps",
                "social networks",
                "languages",
                "themes",
                "about us",
                "DEMO",
                "offer",
                "references",
                "contact",
              ],
              it: [
                "sull'eco-museo",
                "app mobili",
                "social network",
                "lingue",
                "temi",
                "chi siamo",
                "DEMO",
                "offerta",
                "referenze",
                "contatto",
              ],
            };

            const themeNames = {
              hr: { light: "svijetla", dark: "tamna" },
              en: { light: "light", dark: "dark" },
              it: { light: "chiara", dark: "scura" },
            };

            const titles = languageTitles[this.currentLanguage];

            this.contentBoxes.forEach((box, index) => {
              if (!box.dynamicTitle) {
                box.title = titles[index];
              }
            });

            // Update the current theme name for display
            this.themeNames = themeNames[this.currentLanguage];
          },
          boxHasAction(box) {
            return box && typeof box.action === "function";
          },

          //prettier-ignore
          contentBoxes: [
      { title: "o ekomuzeju", pjat: "o_ekomuzeju", revealed: false },
      { title: "mobilne aplikacije", pjat: "mobilne_app", revealed: false },
      { title: "društvene mreže", pjat: "socials", revealed: false },
      { 
        title: "jezici", 
        action: (component) => component.cycleLanguage(), 
        revealed: false,
        dynamicTitle: true,
        pjat: "languages"
      },
      { 
        title: "teme", 
        action: (component) => component.toggleTheme(), 
        revealed: false,
        dynamicTitle: true 
      },
      { title: "o nama", pjat: "onama", revealed: false },
      { title: "DEMO", pjat: "demo", revealed: false },
      { title: "ponuda", pjat: "ponuda", revealed: false },
      { title: "reference", pjat: "reference", revealed: false },
      { title: "kontakt", pjat: "kontakt", revealed: false },
    ],
          transparentBoxes: Array(15)
            .fill()
            .map(() => ({ revealed: false })),

          async openModal(box) {
            if (!box.revealed) return;

            console.log("Opening modal for:", box.title);

            const content = await this.getPjatContent(box);
            openModal(content);
          },

          async getPjatContent(box) {
            try {
              const response = await fetch(
                `pjat/${this.currentLanguage}/${box.pjat}.html`
              );
              if (!response.ok) {
                throw new Error("File not found");
              }
              return await response.text();
            } catch (error) {
              console.error("Error loading content:", error);
              return `
          <div class="pjat">
            <h2>${box.title}</h2>
            <p>Content not available in ${this.currentLanguage}</p>
          </div>
        `;
            }
          },
        };
      }
    </script>
  </body>
</html>
