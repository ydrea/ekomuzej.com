<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ekomuzej - web i mobilne aplikacije</title>
    <link rel="stylesheet" href="astyle.css" />
    <script src="//unpkg.com/alpinejs" defer></script>
  </head>
  <body>
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>

    <div class="c" id="top">
      <main class="container" x-data="app()" x-init="init()">
        <!-- Wrapper holds grid and decorative items (image + title) -->
        <div class="grid-wrapper">
          <!-- Velebit image sits behind the central 3x5 area -->
          <div class="veleb">
            <img src="velebit_z.jpg" alt="Velebit" />
          </div>

          <!-- Title centered over the image -->
          <h1 class="title">Ekomuzej</h1>

          <!-- 5x5 grid -->
          <div class="grid" role="grid" aria-label="tile-grid">
            <!-- Top row: 5 green buttons (explicit areas from top1..top5) -->
            <template x-for="(box, index) in contentBoxes" :key="index">
              <div
                class="box"
                :class="{ 'green': box.revealed, 'trans': false }"
                :style="`grid-area: ${box.area};`"
                @click="boxHasAction(box) ? box.action($data) : openModal(box)"
                x-init="setTimeout(() => { box.revealed = true }, index * 120 + 300)"
                role="button"
                tabindex="0"
              >
                <span
                  x-show="box.revealed"
                  x-text="box.dynamicTitle
                    ? (box.pjat === 'languages'
                        ? (currentLanguage.toUpperCase())
                        : (currentTheme === 'light' ? themeNames?.light : themeNames?.dark))
                    : box.title"
                ></span>
              </div>
            </template>

            <!-- Middle 3 rows (15 places) - transparent image tiles -->
            <template x-for="(box, index) in transparentBoxes" :key="index">
              <div
                class="box trans"
                :class="{ 'trans': box.revealed }"
                :style="`grid-area: ${box.area};`"
                x-init="setTimeout(() => { box.revealed = true }, (contentBoxes.length + index) * 80 + 300)"
                aria-hidden="true"
              ></div>
            </template>

            <!-- Bottom row: the remaining 5 green buttons (areas bottom1..bottom5) -->
            <!-- Note: contentBoxes already contains these — ordered top-first then bottom -->
          </div>
        </div>

        <!-- Modal -->
        <div id="pjatModal" class="modal" aria-hidden="true">
          <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">×</button>
            <div id="modalContent"></div>
          </div>
        </div>
      </main>
    </div>

    <footer class="fut"></footer>

    <script>
      // Simple modal functions
      function openModal(content) {
        const modal = document.getElementById("pjatModal");
        const overlay = document.getElementById("modalOverlay");
        const contentDiv = document.getElementById("modalContent");

        contentDiv.innerHTML = content;
        modal.classList.add("active");
        overlay.classList.add("active");
        modal.setAttribute("aria-hidden", "false");
      }

      function closeModal() {
        const modal = document.getElementById("pjatModal");
        const overlay = document.getElementById("modalOverlay");
        modal.classList.remove("active");
        overlay.classList.remove("active");
        modal.setAttribute("aria-hidden", "true");
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      function app() {
        return {
          currentTheme: "dark",
          currentLanguage: "hr",
          themeNames: { light: "svijetla", dark: "tamna" },

          init() {
            this.updateBoxTitles();
            document.documentElement.setAttribute(
              "data-theme",
              this.currentTheme
            );
          },

          toggleTheme() {
            this.currentTheme =
              this.currentTheme === "light" ? "dark" : "light";
            document.documentElement.setAttribute(
              "data-theme",
              this.currentTheme
            );
          },

          cycleLanguage() {
            const languages = ["hr", "en", "it"];
            const currentIndex = languages.indexOf(this.currentLanguage);
            const nextIndex = (currentIndex + 1) % languages.length;
            this.currentLanguage = languages[nextIndex];
            this.updateBoxTitles();
          },

          updateBoxTitles() {
            const languageTitles = {
              hr: [
                "o ekomuzeju",
                "mobilne aplikacije",
                "društvene mreže",
                "jezici",
                "teme",
                "kontakt",
                "o nama",
                "demo",
                "usluge",
                "reference",
              ],
              en: [
                "about eco-museum",
                "mobile apps",
                "social networks",
                "languages",
                "themes",
                "contact",
                "about us",
                "demo",
                "services",
                "references",
              ],
              it: [
                "sull'eco-museo",
                "app mobili",
                "reti sociali",
                "lingue",
                "temi",
                "contatto",
                "chi siamo",
                "demo",
                "offerta",
                "referenze",
              ],
            };

            const themeNames = {
              hr: { light: "svijetla", dark: "tamna" },
              en: { light: "light", dark: "dark" },
              it: { light: "chiara", dark: "scura" },
            };

            const titles =
              languageTitles[this.currentLanguage] || languageTitles.hr;

            // Assign titles to contentBoxes (10 items)
            this.contentBoxes.forEach((box, i) => {
              if (!box.dynamicTitle) box.title = titles[i];
            });

            this.themeNames = themeNames[this.currentLanguage];
          },

          boxHasAction(box) {
            return box && typeof box.action === "function";
          },

          /* IMPORTANT: contentBoxes order matches fixed grid areas:
             - first 5 are TOP row (left→right)
             - last 5 are BOTTOM row (left→right)
          */
          contentBoxes: [
            // TOP ROW - original order
            {
              title: "o ekomuzeju",
              pjat: "o_ekomuzeju",
              revealed: false,
              area: "top1",
            },
            {
              title: "mobilne aplikacije",
              pjat: "mobilne_app",
              revealed: false,
              area: "top2",
            },
            {
              title: "društvene mreže",
              pjat: "socials",
              revealed: false,
              area: "top3",
            },
            {
              title: "jezici",
              pjat: "languages",
              revealed: false,
              area: "top4",
              dynamicTitle: true,
              action: (c) => c.cycleLanguage(),
            },
            {
              title: "teme",
              pjat: "theme",
              revealed: false,
              area: "top5",
              dynamicTitle: true,
              action: (c) => c.toggleTheme(),
            },

            // BOTTOM ROW
            {
              title: "kontakt",
              pjat: "kontakt",
              revealed: false,
              area: "bottom1",
            },
            {
              title: "o nama",
              pjat: "o_nama",
              revealed: false,
              area: "bottom2",
            },
            {
              title: "demo",
              pjat: "demo",
              revealed: false,
              area: "bottom3",
            },
            {
              title: "usluge",
              pjat: "ponuda",
              revealed: false,
              area: "bottom4",
            },
            {
              title: "reference",
              pjat: "reference",
              revealed: false,
              area: "bottom5",
            },
          ],

          /* 15 middle transparent tiles: mid row2/3/4 positions
             Order: row2 left→right = mid1..mid5, row3 mid6..mid10, row4 mid11..mid15
          */
          transparentBoxes: [
            { area: "mid1", revealed: false },
            { area: "mid2", revealed: false },
            { area: "mid3", revealed: false },
            { area: "mid4", revealed: false },
            { area: "mid5", revealed: false },
            { area: "mid6", revealed: false },
            { area: "mid7", revealed: false },
            { area: "mid8", revealed: false },
            { area: "mid9", revealed: false },
            { area: "mid10", revealed: false },
            { area: "mid11", revealed: false },
            { area: "mid12", revealed: false },
            { area: "mid13", revealed: false },
            { area: "mid14", revealed: false },
            { area: "mid15", revealed: false },
          ],

          async openModal(box) {
            if (!box.revealed) return;
            try {
              const content = await this.getPjatContent(box);
              openModal(content);
            } catch (e) {
              openModal(
                `<div class="pjat"><h2>${box.title}</h2><p>Error loading content.</p></div>`
              );
            }
          },

          async getPjatContent(box) {
            try {
              const response = await fetch(
                `pjat/${this.currentLanguage}/${box.pjat}.html`
              );
              if (!response.ok) throw new Error("File not found");
              return await response.text();
            } catch (err) {
              return `<div class="pjat"><h2>${box.title}</h2><p>Content not available in ${this.currentLanguage}</p></div>`;
            }
          },
        };
      }
    </script>
  </body>
</html>
